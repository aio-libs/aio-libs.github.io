{% extends "!simple/index.html" %}

{% block content_title %}
    <h2>
        News
    </h2>

    <p class="aio-tag-list">
        {% if FEED_ATOM %}
            <a href="{{ FEED_DOMAIN }}/{{ FEED_ATOM }}" type="application/atom+xml" title="RSS Feed"><img class="aio-icon-inline" src="/images/feed-icon-light-on-orange.svg"></a>
        {% endif %}
        Tags: 
        {% for cat, null in tags %}
            <a class="aio-tag" href="{{ SITEURL }}/{{ cat.url }}" {% if cat==category %} aria-current="page" {% endif %}>{{ cat }}</a>
        {% endfor %}
    </p>

{% endblock %}
