{% extends "!simple/tag.html" %}

{% block content_title %}
    <h2>
        Articles tagged with: {{tag}}
    </h2>
    
     <p class="aio-tag-list">
        {% if FEED_ATOM %}
            <a href="{{ FEED_DOMAIN }}/{{ FEED_ATOM }}" type="application/atom+xml"><img class="aio-icon-inline" src="/images/feed-icon-light-on-orange.svg"></a>
        {% endif %}
    </p>
{% endblock %}
